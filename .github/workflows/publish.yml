name: Publish plugins

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: publish-plugins
  cancel-in-progress: false

env:
  API_BASE: https://appstore-api.repebble.com

permissions: {}

# Only plan and publish may mint App Store tokens; they run nothing but curl and jq. Plugin code and
# its npm dependencies run in build, which has no id-token permission.
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      sdk: ${{ steps.plan.outputs.sdk }}
      unbumped: ${{ steps.plan.outputs.unbumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find plugins whose version is not in the store
        id: plan
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$API_BASE" | jq -r .value)
          echo "::add-mask::$token"
          curl -fsS -H "Authorization: Bearer $token" "$API_BASE/api/v1/developer/me" > /tmp/me.json
          : > /tmp/plan.jsonl
          for dir in */; do
            dir=${dir%/}
            proj=$dir; [ -f "$dir/pbw/package.json" ] && proj=$dir/pbw
            [ -f "$proj/package.json" ] || continue
            uuid=$(jq -r '.pebble.uuid // empty | ascii_downcase' "$proj/package.json")
            version=$(jq -r .version "$proj/package.json")
            [ -n "$uuid" ] || continue
            app=$(jq -c --arg u "$uuid" '.apps[] | select((.app_uuid // "") | ascii_downcase == $u)' /tmp/me.json)
            if [ -z "$app" ]; then
              echo "::warning::$dir ($uuid) is not in the store; create the listing once by hand"
              continue
            fi
            if jq -e --arg v "$version" '.versions | index($v)' <<<"$app" >/dev/null; then
              echo "$dir $version already published"
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
                && git diff --quiet "$BEFORE" HEAD -- "$dir" ':(exclude)**/*.md'; then :
              elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
                unbumped="${unbumped:+$unbumped }$dir"
              fi
              continue
            fi
            jq -cn --arg dir "$dir" --arg proj "$proj" --arg version "$version" \
              --arg app_id "$(jq -r .app_id <<<"$app")" \
              --arg notes "$(git log -1 --format=%s -- "$proj/package.json")" \
              '{dir: $dir, proj: $proj, version: $version, app_id: $app_id, notes: $notes}' >> /tmp/plan.jsonl
          done
          plan=$(jq -sc . /tmp/plan.jsonl)
          echo "$plan" | jq -r '.[] | "\(.dir) \(.version) to publish"'
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          sdk=false
          for proj in $(jq -r '.[].proj' <<<"$plan"); do [ -d "$proj/src/c" ] && sdk=true; done
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "unbumped=${unbumped:-}" >> "$GITHUB_OUTPUT"

  require-version-bump:
    needs: plan
    if: needs.plan.outputs.unbumped != ''
    runs-on: ubuntu-latest
    steps:
      - name: Changed plugins must bump their version
        env:
          UNBUMPED: ${{ needs.plan.outputs.unbumped }}
        run: |
          for dir in $UNBUMPED; do
            echo "::error::$dir changed but its package.json version is already in the store; bump the version to publish it"
          done
          exit 1

  build:
    needs: plan
    if: needs.plan.outputs.plan != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pebble SDK
        if: needs.plan.outputs.sdk == 'true'
        run: |
          pipx install pebble-tool
          pebble sdk install latest

      - name: Build and test
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          mkdir -p dist
          jq -c '.[]' <<<"$PLAN" | while read -r item; do
            dir=$(jq -r .dir <<<"$item"); proj=$(jq -r .proj <<<"$item")
            echo "::group::$dir"
            case $dir in
              location-sharing) (npm ci --prefix chat/imessage && cd "$dir" && npm ci && node scripts/build-plugin.mjs && node --test plugin.test.cjs test/*.test.cjs) ;;
              chat) (cd "$dir" && npm ci --prefix imessage && node scripts/build-plugin.mjs && node --test *.test.cjs) ;;
              *) (cd "$dir"
                  [ -f package-lock.json ] && npm ci
                  npm run build --if-present
                  npm test --if-present) ;;
            esac
            python3 scripts/pack-plugin-pbw.py "$proj"
            cp "$proj/build/$(jq -r .name "$proj/package.json").pbw" "dist/$dir.pbw"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pbws
          path: dist/
          retention-days: 1

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pbws
          path: dist

      - name: Publish
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$API_BASE" | jq -r .value)
          echo "::add-mask::$token"
          jq -c '.[]' <<<"$PLAN" | while read -r item; do
            dir=$(jq -r .dir <<<"$item")
            [[ $dir =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad plugin directory $dir"; exit 1; }
            echo "::group::$dir $(jq -r .version <<<"$item")"
            curl -fsS -H "Authorization: Bearer $token" \
              --form-string "version=$(jq -r .version <<<"$item")" \
              --form-string "releaseNotes=$(jq -r .notes <<<"$item")" \
              --form-string isPublished=true \
              -F "pbwFile=@dist/$dir.pbw;type=application/octet-stream" \
              "$API_BASE/api/dashboard/apps/$(jq -r .app_id <<<"$item")/releases"
            echo
            echo "::endgroup::"
          done
