<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat</title>
<style>
:root{color-scheme:light dark;font:16px -apple-system,system-ui,sans-serif;--bg:#f6f6f8;--card:#fff;--text:#202124;--muted:#676872;--line:#e3e3e9;--accent:#155cbe;--soft:#edf2fa;--danger:#b3261e;--avatar:#e7edf6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);padding:20px 18px 40px}main{max-width:680px;margin:auto}
h1{font-size:29px;letter-spacing:-.6px;margin:10px 0}h2{font-size:20px;margin:0 0 14px}h3{font-size:17px;margin:0 0 8px}p{line-height:1.5;margin:10px 0}.subtle{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:16px;margin:18px 0}.row{border-bottom:1px solid var(--line);padding:16px 0}.row:last-child{border-bottom:0}.row strong{overflow-wrap:anywhere}
input,textarea,select,button{font:inherit}input:not([type=checkbox]),textarea,select{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:inherit;margin:6px 0 14px}textarea{min-height:90px;resize:vertical}label{display:block;font-size:14px;font-weight:600}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:600;min-height:44px;margin:6px 6px 0 0}.secondary{background:var(--soft);color:var(--accent)}.danger{background:#ffedeb;color:var(--danger)}.link{padding:8px 0;background:none;color:var(--accent)}button:disabled{opacity:.5;cursor:default}.wide{width:100%}
#notice{padding:14px;background:var(--soft);border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}#notice:empty{display:none}.empty{padding:12px 0;color:var(--muted)}
.connection-actions{margin-top:12px}.search-summary{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.search-summary button{font-size:13px;flex-shrink:0;margin:0}
.emoji{font-size:29px;line-height:1.8;letter-spacing:6px}
details{margin:12px 0}summary{cursor:pointer;color:var(--accent);min-height:34px}fieldset{border:0;padding:0;margin:10px 0}legend{font-size:14px;font-weight:600;margin-bottom:8px}hr{border:0;border-top:1px solid var(--line);margin:22px 0 10px}
[hidden]{display:none!important}:focus-visible{outline:3px solid #448fea;outline-offset:3px}
.account-row{display:flex;align-items:center;justify-content:space-between;width:100%;margin:0;padding:14px 0;background:none;color:var(--text);text-align:left;border-radius:0;border-bottom:1px solid var(--line);font-weight:400}.account-row:last-child{border-bottom:0}.account-row strong{display:block}.account-row .subtle{display:block;margin-top:5px}.chevron{font-size:25px;color:var(--muted)}
.chat-identity{display:flex;gap:12px;align-items:flex-start;min-width:0;flex:1}.avatar{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:42px;height:42px;border-radius:50%;background:var(--avatar);color:var(--accent);font-size:15px;font-weight:600;letter-spacing:.2px;user-select:none}.chat-copy{display:block;min-width:0;flex:1;overflow-wrap:anywhere}.chat-name{display:block;line-height:1.35;overflow-wrap:anywhere;font-size:16px}.chat-original-name{display:block;font-size:14px;color:var(--muted);line-height:1.45;margin-top:2px}.chat-address{display:block;font-size:14px;color:var(--muted);line-height:1.45;margin-top:3px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 0}.badge{font-size:12px;font-weight:500;border-radius:5px;padding:3px 7px;background:var(--soft);color:var(--muted)}
.chat-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0}.chat-row .avatar{width:36px;height:36px;font-size:13px}.chat-row .link{flex-shrink:0;min-width:44px;font-size:14px;margin:0}#approved:empty{display:none}#chat-content>.chat-identity{margin:0 0 24px}#chat-content .chat-name{font-size:20px}
.picker-hint{font-size:14px;color:var(--muted);margin:4px 0 16px}.picker-tools{position:sticky;top:0;z-index:2;padding:10px 0 12px;background:var(--bg)}#search-form label{margin:0 0 8px;font-size:13px;color:var(--muted)}.search-control{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:0 4px 0 14px;box-shadow:0 1px 2px #00000004}.search-control:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}.search-control>svg{width:20px;height:20px;flex-shrink:0;color:var(--muted)}#query{border:0;background:none;margin:0;padding:14px 0;min-width:0;border-radius:0;flex:1;outline:0}#query::-webkit-search-cancel-button{display:none}.search-clear{flex-shrink:0;min-width:44px;margin:0;padding:6px;background:none;color:var(--muted);font-size:24px;font-weight:400}
#connection-filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}#connection-filters legend{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.filter-chip{display:flex;align-items:center;gap:7px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:22px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;background:var(--card)}.filter-chip:has(input:checked){border-color:var(--accent);color:var(--accent);background:var(--soft)}.filter-chip input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex-shrink:0}
#search-status{font-size:13px;margin:4px 2px 12px;white-space:pre-line}#results{display:grid;gap:10px}.result-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.result-card.is-approved{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}.result-activity,.result-reason{font-size:12px;color:var(--muted);margin:7px 0 0 54px}.result-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin:10px 0 0 54px}.result-actions button{margin:0;font-size:14px;min-height:40px;padding:9px 14px}.result-actions .remove-approval{padding:9px 0}.approval-status{font-size:13px;color:var(--accent);margin-right:auto;font-weight:600}#more{margin-top:14px}#contact-access{margin:10px 0;font-size:14px}#contact-access:empty{display:none}#manual-recipient{margin-top:24px}#manual-recipient summary{font-size:15px;font-weight:600}#manual-recipient details{margin:0}#manual-recipient form{margin-top:10px}
.pairing-code{display:block;font-size:28px;letter-spacing:3px;text-align:center;padding:16px;background:var(--soft);border-radius:10px}.card img{max-width:100%;height:auto;border-radius:8px}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--card:#232326;--text:#f3f3f6;--muted:#b5b5be;--line:#3c3c43;--accent:#9dc4ff;--soft:#2d3748;--danger:#ffb4ab;--avatar:#303c50}button{background:#155cbe;color:#fff}.secondary{background:var(--soft);color:var(--accent)}.danger{background:#462827}.link{background:none;color:var(--accent)}.account-row{background:none;color:var(--text)}.search-clear{background:none;color:var(--muted)}}
.setup-progress{display:flex;align-items:center;gap:12px;margin-top:18px;padding:16px;background:var(--soft);border-radius:12px}.setup-progress p{margin:4px 0 0;font-size:14px}.setup-spinner{width:22px;height:22px;flex-shrink:0;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:setup-spin 1s linear infinite}@keyframes setup-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.setup-spinner{animation:none}}
</style></head><body><main>
<div id="notice" role="status" aria-live="polite"></div>
<section id="home"><h1>Chat</h1>
<section class="card"><h2>Accounts</h2><div id="connections"><p class="subtle">Loading…</p></div></section>
<section class="card"><h2>Approved Chats</h2><p class="subtle">Only these chats can be messaged</p><button id="add-chats" class="wide">Add chats</button><p id="approved-count" hidden></p><div id="approved"></div></section></section>
<section id="connection-page" hidden><button id="connection-back" class="link">← Chat</button><h1 id="connection-title"></h1><div id="connection-content"></div></section>
<section id="picker-page" hidden><button id="picker-back" class="link">Done</button><h1>Add chats</h1><p class="picker-hint">Choose who Pebble can message.</p>
<div class="picker-tools"><form id="search-form"><label for="query">Search chats</label><div class="search-control"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="query" type="search" placeholder="Name or phone number" autocomplete="off" enterkeyhint="search"><button id="clear-search" class="search-clear" type="button" aria-label="Clear search" hidden>×</button></div><button type="submit" hidden>Search</button></form><fieldset id="connection-filters"><legend>Search in</legend></fieldset></div>
<div class="search-summary"><p id="search-status" class="subtle" role="status"></p><button id="refresh-chats" class="link" hidden>Refresh chats</button></div><div id="results"></div><button id="more" class="secondary wide" hidden>Load more</button><div id="contact-access"></div>
<section class="card" id="manual-recipient" hidden><details open><summary>Add Manually</summary><form id="manual-form"><label for="manual-account">Account</label><select id="manual-account"></select><label for="manual-name">Name</label><input id="manual-name" maxlength="64" required><label id="manual-address-label" for="manual-address">Phone number or email</label><input id="manual-address" placeholder="+14155550123 or name@example.com" required><button type="submit">Add chat</button></form></details></section></section>
<section id="chat-page" hidden><button id="chat-back" class="link">← Chat</button><h1 id="chat-title"></h1><div id="chat-content" class="card"></div></section></main><script>/* CHAT_SETTINGS_SCRIPT */</script></body></html>
