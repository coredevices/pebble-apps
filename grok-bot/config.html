<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Grok Bot settings</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px system-ui,
          sans-serif;
      }
      body {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        font-size: 28px;
      }
      p {
        line-height: 1.5;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 24px 0 8px;
      }
      select,
      button {
        font: inherit;
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 10px;
        margin: 6px 0;
      }
      #status {
        min-height: 48px;
        margin-top: 20px;
      }
      button:disabled,
      select:disabled {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <h1>Grok Bot</h1>
    <p>Send messages from Pebble to your Grok Bot and hear its replies. Sign in with the Cursor account you use for Grok Bot.</p>
    <button id="signin" disabled>Sign in to Grok Bot</button>
    <label for="bot">Send messages to</label><select id="bot" disabled></select>
    <button id="refresh" disabled>Refresh bots</button><button id="disconnect" disabled>Disconnect</button>
    <p id="status" role="status" aria-live="polite">Starting Grok Bot…</p>
    <script>
      const $ = (id) => document.getElementById(id);
      let configured = false,
        busy = false,
        selected = null;
      const say = (text) => {
        $("status").textContent = text;
      };
      function controls() {
        for (const id of ["signin", "bot", "refresh", "disconnect"])
          $(id).disabled = busy || (id !== "signin" && !configured);
      }
      async function send(message) {
        const result = await Pebble.sendMessage("plugin", message);
        if (result.error) throw new Error(result.error);
        return result;
      }
      function render(result) {
        configured = result.configured;
        selected = result.selected;
        if (result.bots)
          $("bot").replaceChildren(
            ...result.bots.map((b) => {
              const o = document.createElement("option");
              o.value = b.id;
              o.textContent = b.title;
              return o;
            }),
          );
        if (!configured) $("bot").replaceChildren();
        if (selected) $("bot").value = selected;
        controls();
      }
      async function run(fn) {
        if (busy) return;
        busy = true;
        controls();
        try {
          await fn();
        } catch (e) {
          say(e.message || "Could not connect to Grok Bot.");
          if (selected) $("bot").value = selected;
        } finally {
          busy = false;
          controls();
        }
      }
      // The settings page isn't a secure context, so crypto.subtle and crypto.randomUUID are missing.
      function sha256(bytes) {
        const K = [];
        for (let n = 2, found = 0; found < 64; n++) {
          let prime = true;
          for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
          if (prime) K[found++] = (Math.cbrt(n) % 1) * 2 ** 32 | 0;
        }
        const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
        const length = bytes.length;
        const padded = new Uint8Array(((length + 9 + 63) >> 6) << 6);
        padded.set(bytes);
        padded[length] = 0x80;
        new DataView(padded.buffer).setUint32(padded.length - 4, length * 8);
        const w = new Uint32Array(64);
        const rotr = (x, n) => (x >>> n) | (x << (32 - n));
        for (let i = 0; i < padded.length; i += 64) {
          for (let t = 0; t < 16; t++) w[t] = new DataView(padded.buffer).getUint32(i + t * 4);
          for (let t = 16; t < 64; t++) {
            const s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
            const s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
            w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
          }
          let [a, b, c, d, e, f, g, h] = H;
          for (let t = 0; t < 64; t++) {
            const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + w[t]) | 0;
            const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
            h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
          }
          [a, b, c, d, e, f, g, h].forEach((v, k) => (H[k] = (H[k] + v) | 0));
        }
        const out = new Uint8Array(32);
        H.forEach((v, k) => new DataView(out.buffer).setUint32(k * 4, v));
        return out;
      }
      function randomUuid() {
        const b = crypto.getRandomValues(new Uint8Array(16));
        b[6] = (b[6] & 0x0f) | 0x40;
        b[8] = (b[8] & 0x3f) | 0x80;
        const h = Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
        return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
      }
      // Cursor's PKCE login, as the Grok Bot app starts it; the plugin polls for the token.
      async function cursorLogin() {
        const base64Url = (bytes) =>
          btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        const verifier = base64Url(crypto.getRandomValues(new Uint8Array(32)));
        const digest = sha256(new TextEncoder().encode(verifier));
        const uuid = randomUuid();
        const url = "https://cursor.com/loginDeepControl?challenge=" + base64Url(digest) +
          "&uuid=" + uuid + "&mode=login&redirectTarget=sand";
        return { url, uuid, verifier };
      }
      $("signin").onclick = () =>
        run(async () => {
          if (!Pebble.webSignIn) {
            say("Grok Bot sign-in requires a newer version of the Pebble app.");
            return;
          }
          say("Opening Grok Bot sign-in…");
          const login = await cursorLogin();
          const cookies = await Pebble.webSignIn({
            url: login.url,
            cookies: ["WorkosCursorSessionToken"],
            domain: "cursor.com",
          });
          if (!cookies) {
            say("Sign-in cancelled.");
            return;
          }
          say("Connecting to your Grok Bot computer…");
          render(await send({ type: "finishSignIn", uuid: login.uuid, verifier: login.verifier }));
          say(selected ? "Connected to Grok Bot." : "Connected, but you have no bots yet. Create one in Grok Bot.");
        });
      $("refresh").onclick = () =>
        run(async () => {
          say("Loading bots…");
          render(await send({ type: "listBots" }));
          say("Bots refreshed.");
        });
      $("bot").onchange = () => {
        const id = $("bot").value;
        run(async () => {
          say("Saving bot…");
          render(await send({ type: "selectBot", id }));
          say("Bot saved.");
        });
      };
      $("disconnect").onclick = () =>
        run(async () => {
          render(await send({ type: "disconnect" }));
          say("Disconnected. Saved sign-in removed from this plugin.");
        });
      Pebble.addEventListener("ready", (event) => {
        if (event.target !== "plugin") return;
        run(async () => {
          const state = await send({ type: "status" });
          render(state);
          if (state.configured) {
            say("Loading bots…");
            render(await send({ type: "listBots" }));
            say("Connected to Grok Bot.");
          } else say("Sign in to connect your Grok Bot.");
        });
      });
    </script>
  </body>
</html>
