[package]
name = "corten-nac-oracle"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[package.metadata.corten]
repository = "https://github.com/lrhodin/corten-matrix"
commit = "501403fcbe8802cc427e9ccab3573c5367508fdf"
source = "rustpush/open-absinthe"

[dependencies]
base64 = "0.22.1"
goblin = "0.10"
log = "0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha1 = "0.10"
sha2 = "0.10"
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }

[features]
serde = []

[[bin]]
name = "corten-nac-oracle"
path = "src/main.rs"
