syntax = "proto3";
package hatch.noise;
// Observed Muse web protocol, 2026-09-28.
message TransportFrame {
 optional int64 chunk_id = 1;
 optional uint32 chunk_index = 2;
 optional uint32 total_chunks = 3;
 optional bytes payload = 4;
}
message ServiceRequest { int32 service = 1; bytes payload = 2; }
message ServiceResponse { bytes payload = 1; }
message ServiceFrame {
 int64 stream_id = 1;
 oneof kind {
  ApplicationRequest request = 2;
  ApplicationResponse response = 3;
  BodyChunk body_chunk = 4;
  Reset reset = 5;
 }
}
message Header { string key = 1; string value = 2; }
message ApplicationRequest {
 string verb = 1;
 string path = 2;
 repeated Header headers = 3;
 bytes body = 4;
 bool end_body = 5;
}
message ApplicationResponse {
 int32 status = 1;
 repeated Header headers = 2;
 bytes body = 3;
 bool end_body = 4;
}
message BodyChunk { bytes data = 1; bool end_body = 2; }
message Reset { int32 code = 1; string reason = 2; }
message ClientHello { bytes client_nonce = 1; }
message RVChallenge { bytes attestation = 1; int32 state = 2; bytes vm_nonce = 3; bytes vm_proof = 4; }
